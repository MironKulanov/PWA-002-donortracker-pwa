name: PWA publication expiry
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check expiry and disable Pages if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f .pwa-expiration.json ]; then echo 'No expiry config'; exit 0; fi
          expires=$(jq -r '.expires_at // empty' .pwa-expiration.json)
          disabled=$(jq -r '.disabled // false' .pwa-expiration.json)
          if [ -z "$expires" ] || [ "$expires" = "null" ] || [ "$disabled" = "true" ]; then echo 'Unlimited or already disabled'; exit 0; fi
          now=$(date -u +%s)
          if [ "$now" -ge "$expires" ]; then
            code=$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/pages")
            if [ "$code" = '204' ] || [ "$code" = '404' ]; then echo 'GitHub Pages disabled or already absent'; else cat /tmp/pages-response.json; exit 1; fi
          else echo 'Publication is still valid'; fi
